<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Fake - Estilo Discord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2b2d31; }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #111214; }
    </style>
</head>

<body class="bg-[#313338] text-[#dbdee1] font-sans h-screen flex overflow-hidden select-none">

    <!-- Barra Lateral Esquerda (Servidores) -->
    <aside class="w-[72px] bg-[#1e1f22] flex flex-col items-center py-3 gap-2 shrink-0">
        <div class="w-12 h-12 bg-[#5865f2] rounded-2xl flex items-center justify-center text-white font-bold text-xl shadow-md cursor-pointer transition-all duration-200 hover:rounded-xl">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
        </div>
        <div class="w-8 h-[2px] bg-[#35363c] rounded-full my-1"></div>
        <div class="w-12 h-12 bg-[#313338] hover:bg-[#23a559] text-[#23a559] hover:text-white rounded-3xl hover:rounded-2xl flex items-center justify-center font-semibold cursor-pointer transition-all duration-200">
            #
        </div>
    </aside>

    <!-- Lista de Canais -->
    <aside class="hidden md:flex w-60 bg-[#2b2d31] flex-col justify-between shrink-0">
        <div>
            <header class="h-12 px-4 flex items-center justify-between border-b border-[#1f2023] shadow-sm font-bold text-white">
                <span>Chat Fake Server</span>
            </header>

            <div class="p-2 space-y-1">
                <div class="px-2 pt-3 pb-1 text-xs font-bold uppercase tracking-wider text-[#949ba4]">
                    Canais de Texto
                </div>
                <div class="flex items-center gap-2 px-2 py-1.5 rounded bg-[#404249] text-white font-medium cursor-pointer">
                    <span class="text-[#80848e] text-xl leading-none">#</span>
                    <span>geral</span>
                </div>
            </div>
        </div>

        <!-- Rodapé com Status e Upload de Foto -->
        <div class="h-[52px] bg-[#232428] px-2 flex items-center justify-between">
            <div onclick="document.getElementById('avatar-input').click()" title="Clique para alterar foto de perfil" class="flex items-center gap-2 cursor-pointer hover:bg-[#35373c] p-1 rounded flex-1 min-w-0 transition">
                <div class="relative shrink-0">
                    <div id="avatar-usuario" class="w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center text-white font-bold text-sm overflow-hidden">
                        ?
                    </div>
                    <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-[#23a559] border-2 border-[#232428] rounded-full"></span>
                </div>
                <div class="flex flex-col leading-tight overflow-hidden">
                    <span id="nome-status" class="text-sm font-semibold text-white truncate">Visitante</span>
                    <span class="text-[11px] text-[#949ba4]">Clique p/ foto</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Área Principal do Chat -->
    <main class="flex-1 flex flex-col bg-[#313338] min-w-0">
        
        <header class="h-12 px-4 flex items-center gap-2 border-b border-[#1f2023] shadow-sm shrink-0">
            <span class="text-[#80848e] text-2xl font-light">#</span>
            <h1 class="font-bold text-white">geral</h1>
            <span class="hidden sm:inline text-[#949ba4] text-sm border-l border-[#3f4147] pl-3 ml-1">
                Passe o mouse nas suas mensagens para editar ou excluir
            </span>
        </header>

        <!-- Lista de Mensagens -->
        <ul id="mensagens" class="flex-1 overflow-y-auto p-4 space-y-4 select-text">
            <li class="flex flex-col gap-1 pb-4 border-b border-[#3f4147]">
                <div class="w-14 h-14 rounded-full bg-[#41434a] flex items-center justify-center text-white text-3xl font-bold mb-2">
                    #
                </div>
                <h2 class="text-2xl font-bold text-white">Bem-vindo ao #geral!</h2>
                <p class="text-[#949ba4] text-sm">Escolha uma foto de perfil, digite seu nome e comece a conversar.</p>
            </li>
        </ul>

        <!-- Formulário de Envio -->
        <form class="px-4 pb-6 pt-2 shrink-0">
            <div class="bg-[#383a40] rounded-lg flex items-center px-3 py-2 gap-2.5 shadow-inner">
                
                <!-- Input Oculto de Arquivo + Botão de Avatar -->
                <input type="file" id="avatar-input" accept="image/*" class="hidden">
                <button 
                    type="button" 
                    id="btn-avatar"
                    onclick="document.getElementById('avatar-input').click()"
                    title="Escolher foto de perfil"
                    class="w-9 h-9 rounded-full bg-[#2b2d31] hover:bg-[#404249] flex items-center justify-center text-[#b5bac1] hover:text-white shrink-0 overflow-hidden border border-[#4e5058] transition cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>

                <!-- Input do Nome -->
                <input 
                    type="text" 
                    id="nome" 
                    placeholder="Seu nome" 
                    autocomplete="off"
                    class="w-28 sm:w-36 bg-[#2b2d31] text-white placeholder-[#949ba4] text-sm px-3 py-1.5 rounded border border-transparent focus:border-[#5865f2] focus:outline-none disabled:opacity-60 disabled:cursor-not-allowed transition"
                >

                <div class="w-[1px] h-6 bg-[#4e5058]"></div>

                <!-- Input da Mensagem -->
                <input 
                    type="text" 
                    id="mensagem" 
                    placeholder="Conversar em #geral" 
                    autocomplete="off"
                    class="flex-1 bg-transparent text-[#dbdee1] placeholder-[#949ba4] text-sm focus:outline-none"
                >

                <!-- Botão Enviar -->
                <button 
                    type="submit"
                    class="bg-[#5865f2] hover:bg-[#4752c4] text-white text-sm font-medium px-4 py-1.5 rounded transition cursor-pointer shrink-0">
                    Enviar
                </button>
            </div>
        </form>
    </main>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        const nomeInput = document.getElementById('nome');
        const mensagemInput = document.getElementById('mensagem');
        const mensagens = document.getElementById('mensagens');
        const nomeStatus = document.getElementById('nome-status');
        const avatarUsuario = document.getElementById('avatar-usuario');
        const avatarInput = document.getElementById('avatar-input');
        const btnAvatar = document.getElementById('btn-avatar');

        let avatarBase64 = null;
        let meuNomeTravado = null;

        // Redimensiona a imagem no navegador para 128x128px (evita travar o Socket.IO com fotos pesadas)
        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 128;
                    canvas.height = 128;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 128, 128);
                    
                    avatarBase64 = canvas.toDataURL('image/jpeg', 0.8);

                    // Atualiza as prévias do avatar na tela
                    btnAvatar.innerHTML = `<img src="${avatarBase64}" class="w-full h-full object-cover">`;
                    avatarUsuario.innerHTML = `<img src="${avatarBase64}" class="w-full h-full object-cover">`;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function gerarCorAvatar(nome) {
            const cores = ['#5865f2', '#23a559', '#f0b232', '#f23f43', '#eb459e', '#00a8fc'];
            let soma = 0;
            for (let i = 0; i < nome.length; i++) soma += nome.charCodeAt(i);
            return cores[soma % cores.length];
        }

        function obterHoraAtual() {
            return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        // Envio de nova mensagem
        document.querySelector('form').addEventListener('submit', event => {
            event.preventDefault();
            const nome = nomeInput.value.trim();
            const mensagem = mensagemInput.value.trim();

            if (nome && mensagem) {
                meuNomeTravado = nome;
                // Gera um ID único para a mensagem (timestamp + número aleatório)
                const id = Date.now().toString(36) + Math.random().toString(36).substring(2);

                socket.emit('chat message', { 
                    id, 
                    nome, 
                    mensagem, 
                    avatar: avatarBase64 
                });

                mensagemInput.value = '';
                nomeInput.disabled = true;
                nomeStatus.textContent = nome;

                if (!avatarBase64) {
                    avatarUsuario.textContent = nome[0].toUpperCase();
                    avatarUsuario.style.backgroundColor = gerarCorAvatar(nome);
                }
            }
        });

        // Recebimento de nova mensagem
        socket.on('chat message', dados => {
            const item = document.createElement('li');
            item.id = `msg-${dados.id}`;
            item.className = 'relative flex items-start gap-4 hover:bg-[#2e3035] -mx-4 px-4 py-1.5 rounded transition group';

            // Avatar (Foto enviada ou Inicial colorida)
            const avatar = document.createElement('div');
            avatar.className = 'w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-base shrink-0 mt-0.5 overflow-hidden';
            if (dados.avatar) {
                const img = document.createElement('img');
                img.src = dados.avatar;
                img.className = 'w-full h-full object-cover';
                avatar.appendChild(img);
            } else {
                avatar.style.backgroundColor = gerarCorAvatar(dados.nome);
                avatar.textContent = dados.nome[0].toUpperCase();
            }

            // Conteúdo da mensagem
            const conteudo = document.createElement('div');
            conteudo.className = 'flex-1 flex flex-col min-w-0';

            const cabecalho = document.createElement('div');
            cabecalho.className = 'flex items-baseline gap-2';

            const autor = document.createElement('span');
            autor.className = 'font-medium text-white hover:underline cursor-pointer';
            autor.textContent = dados.nome;

            const horario = document.createElement('span');
            horario.className = 'text-xs text-[#949ba4]';
            horario.textContent = `Hoje às ${obterHoraAtual()}`;

            const texto = document.createElement('p');
            texto.id = `texto-${dados.id}`;
            texto.className = 'text-[#dbdee1] text-[15px] leading-snug break-words';
            texto.textContent = dados.mensagem;

            cabecalho.appendChild(autor);
            cabecalho.appendChild(horario);
            conteudo.appendChild(cabecalho);
            conteudo.appendChild(texto);

            item.appendChild(avatar);
            item.appendChild(conteudo);

            // Se a mensagem for do usuário atual, adiciona barra de ações (Editar / Excluir) no hover
            if (meuNomeTravado && dados.nome === meuNomeTravado) {
                const acoes = document.createElement('div');
                acoes.className = 'hidden group-hover:flex items-center bg-[#313338] border border-[#26272d] rounded shadow-md absolute -top-3 right-4 overflow-hidden';

                // Botão Editar
                const btnEditar = document.createElement('button');
                btnEditar.type = 'button';
                btnEditar.title = 'Editar mensagem';
                btnEditar.className = 'p-1.5 text-[#b5bac1] hover:text-white hover:bg-[#404249] transition cursor-pointer';
                btnEditar.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>`;
                btnEditar.onclick = () => iniciarEdicao(dados.id);

                // Botão Excluir
                const btnExcluir = document.createElement('button');
                btnExcluir.type = 'button';
                btnExcluir.title = 'Excluir mensagem';
                btnExcluir.className = 'p-1.5 text-[#f23f43] hover:text-white hover:bg-[#f23f43] transition cursor-pointer';
                btnExcluir.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>`;
                btnExcluir.onclick = () => socket.emit('delete message', dados.id);

                acoes.appendChild(btnEditar);
                acoes.appendChild(btnExcluir);
                item.appendChild(acoes);
            }

            mensagens.appendChild(item);
            mensagens.scrollTop = mensagens.scrollHeight;
        });

        // Abre input inline estilo Discord para editar a mensagem
        function iniciarEdicao(id) {
            const textoEl = document.getElementById(`texto-${id}`);
            if (!textoEl || textoEl.dataset.editando === 'true') return;

            const textoOriginal = textoEl.dataset.raw || textoEl.textContent;
            textoEl.dataset.editando = 'true';

            const inputEdit = document.createElement('input');
            inputEdit.type = 'text';
            inputEdit.value = textoOriginal;
            inputEdit.className = 'w-full bg-[#383a40] text-[#dbdee1] text-[15px] px-3 py-1.5 rounded mt-1 border border-[#5865f2] focus:outline-none';

            const dica = document.createElement('span');
            dica.className = 'text-[11px] text-[#949ba4] mt-1 block';
            dica.textContent = 'Enter para salvar • Esc para cancelar';

            textoEl.innerHTML = '';
            textoEl.appendChild(inputEdit);
            textoEl.appendChild(dica);
            inputEdit.focus();

            inputEdit.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const novoTexto = inputEdit.value.trim();
                    if (novoTexto && novoTexto !== textoOriginal) {
                        socket.emit('edit message', { id, novoTexto });
                    } else {
                        cancelarEdicao();
                    }
                } else if (e.key === 'Escape') {
                    cancelarEdicao();
                }
            });

            function cancelarEdicao() {
                textoEl.dataset.editando = 'false';
                textoEl.textContent = textoOriginal;
                if (textoEl.dataset.editado === 'true') {
                    anexarTagEditado(textoEl);
                }
            }
        }

        function anexarTagEditado(elemento) {
            const tag = document.createElement('span');
            tag.className = 'text-[10px] text-[#949ba4] ml-1.5 select-none';
            tag.textContent = '(editado)';
            elemento.appendChild(tag);
        }

        // Atualiza a mensagem na tela de todos quando alguém edita
        socket.on('edit message', ({ id, novoTexto }) => {
            const textoEl = document.getElementById(`texto-${id}`);
            if (textoEl) {
                textoEl.dataset.editando = 'false';
                textoEl.dataset.editado = 'true';
                textoEl.dataset.raw = novoTexto;
                textoEl.textContent = novoTexto;
                anexarTagEditado(textoEl);
            }
        });

        // Remove a mensagem da tela de todos quando alguém exclui
        socket.on('delete message', (id) => {
            const item = document.getElementById(`msg-${id}`);
            if (item) item.remove();
        });
    </script>
</body>

</html>
